<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лист Персонажа</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0d0b0;
            font-family: 'Georgia', serif;
            padding: 20px;
            margin: 0;
        }
        .sheet-container {
            max-width: 500px;
            margin: 0 auto;
            background: #2a241c;
            border: 2px solid #8b7355;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: #ffcc66;
            text-align: center;
            border-bottom: 1px solid #8b7355;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffcc66;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            background-color: #1a1a1a;
            border: 1px solid #8b7355;
            color: #e0d0b0;
            font-family: 'Georgia', serif;
            box-sizing: border-box;
            border-radius: 4px;
        }
        .btn-back {
            display: inline-block;
            margin-top: 20px;
            color: #cd9a62;
            text-decoration: none;
        }
        .btn-back:hover {
            color: #ffcc66;
        }
        .status-text {
            font-size: 12px;
            color: #706050;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="sheet-container">
        <h2>📜 Карточка Героя</h2>
        
        <div class="form-group">
            <label for="char-name">Имя Персонажа:</label>
            <input type="text" id="char-name" placeholder="Например: Тордин Бронзобород">
        </div>

        <div class="form-group">
            <label for="char-class">Класс и Уровень:</label>
            <input type="text" id="char-class" placeholder="Воин 3 уровня">
        </div>

        <div class="form-group">
            <label for="char-hp">Здоровье (Хитпоинты):</label>
            <input type="number" id="char-hp" placeholder="35">
        </div>

        <div class="form-group">
            <label for="char-bio">История и Снаряжение:</label>
            <textarea id="char-bio" rows="5" placeholder="Старый топор, мешок сухарей..."></textarea>
        </div>

        <div class="status-text" id="save-status">Все изменения сохраняются автоматически</div>
        
        <a href="index.html" class="btn-back">⬅ Вернуться в Хаб</a>
    </div>

    <script>
        // Список ID всех полей, которые мы хотим отслеживать
        const fields = ['char-name', 'char-class', 'char-hp', 'char-bio'];
        const statusText = document.getElementById('save-status');

        // 1. Автоматическая ЗАГРУЗКА данных при открытии страницы
        window.addEventListener('DOMContentLoaded', () => {
            fields.forEach(id => {
                const savedValue = localStorage.getItem(id);
                if (savedValue) {
                    document.getElementById(id).value = savedValue;
                }
            });
        });

        // 2. Автоматическое СОХРАНЕНИЕ данных при вводе текста
        fields.forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                localStorage.setItem(id, e.target.value);
                
                // Визуальный эффект успешного сохранения
                statusText.textContent = "💾 Сохранено...";
                statusText.style.color = "#ffcc66";
                
                // Через секунду возвращаем стандартный текст
                setTimeout(() => {
                    statusText.textContent = "Все изменения сохраняются автоматически";
                    statusText.style.color = "#706050";
                }, 1000);
            });
        });
    </script>

</body>
</html>
